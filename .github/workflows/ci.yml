name: CI Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - phase-1-security-foundation-2026-08-15

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-deterministic-tests:
    name: Quality and deterministic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Security regression checks
        run: pnpm --filter @aura/api test:security

      - name: Production-readiness regression checks
        run: pnpm --filter @aura/api test:production

      - name: Billing regression checks
        run: pnpm --filter @aura/api test:billing

      - name: Storage and FFmpeg policy checks
        run: pnpm --filter @aura/api test:storage

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
